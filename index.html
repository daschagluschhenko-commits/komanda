<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Моя команда Atomy</title>
<style>
/* Layout: sticky top bar with tabs → toolbar → card grid; detail opens in a side sheet (bottom sheet on phones) */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eaefe9; --line:#d7ded5;
  --ink:#1c2a2a; --muted:#5d6b69; --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#d6ebe3;
  --warm:#e8894f; --warm-soft:#fbe6d8; --danger:#b8402f;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111817; --surface:#18221f; --surface-2:#1f2b28; --line:#2c3b37;
  --ink:#e6eeea; --muted:#97a8a3; --accent:#58c2a2; --accent-ink:#0d1a16; --accent-soft:#1d3a32;
  --warm:#f0a070; --warm-soft:#3a2a1f; --danger:#ef7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111817; --surface:#18221f; --surface-2:#1f2b28; --line:#2c3b37;
  --ink:#e6eeea; --muted:#97a8a3; --accent:#58c2a2; --accent-ink:#0d1a16; --accent-soft:#1d3a32;
  --warm:#f0a070; --warm-soft:#3a2a1f; --danger:#ef7a66; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--display);font-size:15px;flex:none}
.brand h1{font-size:16px}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--body);font-weight:500}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.tab{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.08)}
.tab .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;margin-left:4px}

/* banners */
.viewing{background:var(--warm-soft);border-bottom:1px solid var(--line)}
.viewing .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}

main{padding-block:24px 64px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar h2{font-size:20px;margin-right:auto}
.search{flex:1 1 220px;max-width:320px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px}
.btn{border:1px solid transparent;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:none;color:var(--danger);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent)}
.card .row{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.card .nm{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.meta b{color:var(--ink)}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.stage.s1{background:var(--warm-soft);color:var(--warm)}
.stage.s3,.stage.s4{background:var(--accent-soft);color:var(--accent)}
.due{color:var(--warm);font-weight:700}

/* empty */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h3{font-size:16px;color:var(--ink)}
.empty p{margin:0;max-width:46ch}

/* matrix table */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px;text-align:center}
thead th{vertical-align:bottom;font-weight:600;color:var(--muted);height:150px;white-space:nowrap}
thead th .v{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:140px;overflow:hidden;text-overflow:ellipsis}
th.fio,td.fio{position:sticky;left:0;background:var(--surface);text-align:left;min-width:170px;max-width:220px;z-index:1;border-right:1px solid var(--line)}
td.fio button{border:0;background:none;font-weight:700;text-align:left;padding:4px;color:var(--ink)}
thead th.grp{height:auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--surface-2);border-right:1px solid var(--line)}
td.pct{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:none;display:grid;place-items:center;margin:auto;padding:0}
.tick[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick svg{width:14px;height:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 20 18/.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgb(0 0 0/.18)}
.sheet header{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet header h2{font-size:17px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.sheet .body{overflow-y:auto;padding:20px;display:grid;gap:22px;flex:1}
.sheet footer{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet footer .sp{margin-right:auto}
@media (max-width:640px){.sheet{top:auto;height:92%;border-radius:18px 18px 0 0}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
@media (max-width:480px){.fields{grid-template-columns:1fr}}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px;font-weight:500;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
.sec h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;font-family:var(--body);font-weight:800}
.sec h3 span{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:0}
.checks{display:grid;gap:6px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%;font-weight:600}
.chk .tick{margin:0;flex:none}
.chk[aria-checked="true"]{border-color:var(--accent-soft)}
.chk[aria-checked="true"] .lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
.bigmeter{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.bigmeter .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bigmeter b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}

/* register */
.reg{max-width:460px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:18px}
.reg h2{font-size:24px}
.reg p{margin:0;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:40;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;font-weight:600}
@media (max-width:560px){.tabs{width:100%;justify-content:space-between}.tab{flex:1;padding:7px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<header class="top">
  <div class="wrap">
    <div class="brand"><div class="logo">A</div><div style="min-width:0"><h1>Моя команда</h1><small id="whoami">Загружаю…</small></div></div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" role="tab" data-tab="partners" aria-selected="true">Партнёры<span class="n" id="nP"></span></button>
      <button class="tab" role="tab" data-tab="clients" aria-selected="false">Клиенты<span class="n" id="nC"></span></button>
      <button class="tab" role="tab" data-tab="team" aria-selected="false" id="teamTab" hidden>Вся команда</button>
      <button class="tab" role="tab" data-tab="profile" aria-selected="false">Профиль</button>
    </nav>
    <button class="btn ghost" id="logout" hidden style="padding:7px 14px;font-size:13px">Выйти</button>
  </div>
</header>
<div class="viewing" id="viewing" hidden><div class="wrap"><span id="viewingTxt"></span><button class="linkbtn" id="backMe">Вернуться к себе</button></div></div>

<main class="wrap" id="main">
  <div class="empty" id="boot"><h3>Подключаюсь к базе…</h3><p>Здесь появятся ваши партнёры и клиенты.</p></div>
</main>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ====== НАСТРОЙКИ: вставьте сюда данные из Firebase ====== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDFiyP8X3kATRR3EMTB-f2lfCyvWh7A1K8",
  authDomain: "atomy-komanda.firebaseapp.com",
  projectId: "atomy-komanda",
  storageBucket: "atomy-komanda.firebasestorage.app",
  messagingSenderId: "952694977815",
  appId: "1:952694977815:web:c21eff4ae1e763a2457352"
};
/* Email руководителя: этот человек видит вкладку «Вся команда» */
const LEADER_EMAILS = ["dasha.galchenko@yahoo.com"];
/* ========================================================= */
const STAGES=[
 {k:"start",t:"Старт",items:[["cab","Кабинет активирован"],["order","Первый заказ"],["goals","Цели определены"],["unbox","Распаковку снял"],["hemo","ХемоХим пробовал"]]},
 {k:"know",t:"Изучил",items:[["infoCo","Инфу о компании изучил"],["infoProd","Инфу о продукте изучил"],["mplan","Маркетинг план изучил"],["reg","Умеет делать регистрацию"]]},
 {k:"work",t:"Работа",items:[["content","Контент выставляет"],["list","Список знакомых"],["meet","Встречи назначил"],["calls","Созвоны делает"],["cchat","Клиентский чат завёл"],["lottery","Лотереи / розыгрыши проводит"],["report","Отчёт по ежедневной работе делает"]]},
 {k:"team",t:"В команде",items:[["leader","Лидер чат проверил, дал рекомендации"],["active","В командных чатах активно проявляется"],["callsVisit","Созвоны посещает"],["offline","Офлайн встречи посещает"],["conf","Конференции посещает"]]},
 {k:"result",t:"Результат",items:[["l300","Личка 300 накоплено"]]}
];
const ALL=STAGES.flatMap(s=>s.items);
const TOTAL=ALL.length;
const CLIENT_STATUS=["Новый","Думает","Купил","Постоянный","Не актуален"];
const TICK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';

const S={db:null,user:null,uid:null,isOwner:false,me:null,viewUid:null,viewName:"",tab:"partners",
  partners:[],clients:[],members:[],unsub:[],q:"",pView:"cards",cFilter:"all",readOnly:false};
const $=s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v===true)e.setAttribute(k,"");else if(v!==false&&v!=null)e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}return e};
const initials=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>d?new Date(d+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short"}):"";
const done=p=>ALL.filter(([k])=>p.checks&&p.checks[k]).length;
function stageOf(p){const n=done(p);if(n===0)return["Новичок","s0"];if(n<8)return["Стартует","s1"];if(n<16)return["В работе","s2"];if(n<TOTAL)return["Почти у цели","s3"];return["Всё пройдено","s4"]}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
function base(){return S.db.collection("members").doc(S.viewUid)}

/* ---------- boot ---------- */
try{const fl=document.createElement("link");fl.rel="stylesheet";fl.href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap";document.head.appendChild(fl)}catch{}
function bootFail(t,m){$("#main").replaceChildren(el("div",{class:"empty"},el("h3",{},t),el("p",{},m)));$("#whoami").textContent="Нет подключения"}
const ERR={"auth/email-already-in-use":"Этот email уже зарегистрирован. Нажмите «Войти».","auth/invalid-email":"Проверьте email, в нём ошибка.","auth/weak-password":"Пароль слишком короткий, нужно минимум 6 символов.","auth/invalid-credential":"Неверный email или пароль.","auth/wrong-password":"Неверный email или пароль.","auth/user-not-found":"Такой email не зарегистрирован.","auth/too-many-requests":"Слишком много попыток. Подождите пару минут.","auth/network-request-failed":"Нет связи с сервером. Проверьте интернет."};
const errText=e=>ERR[e&&e.code]||"Не получилось. Попробуйте ещё раз.";
let AUTH;
if(!window.firebase||FIREBASE_CONFIG.apiKey.startsWith("ВСТАВЬТЕ")){bootFail("Сайт ещё не настроен","Вставьте настройки Firebase в файл index.html (см. инструкцию).")}
else{
  firebase.initializeApp(FIREBASE_CONFIG);
  AUTH=firebase.auth();AUTH.languageCode="ru";
  S.db=firebase.firestore();
  AUTH.onAuthStateChanged(async u=>{
    if(!u){renderLogin("login");return}
    S.uid=u.uid;S.email=(u.email||"").toLowerCase();S.isOwner=LEADER_EMAILS.map(x=>x.toLowerCase()).includes(S.email);
    $("#logout").hidden=false;
    try{const snap=await S.db.doc("members/"+S.uid).get();if(snap.exists){S.me=snap.data();start()}else renderRegister()}
    catch(e){console.error(e);bootFail("Не удалось загрузить данные","Обновите страницу. Если не поможет, напишите Даше.")}
  });
}
$("#logout").onclick=()=>AUTH.signOut().then(()=>location.reload());

function renderLogin(mode){
  $("#whoami").textContent=mode==="login"?"Вход":"Регистрация";
  const isReg=mode==="reg";
  const f=el("form",{class:"reg"},
    el("h2",{},isReg?"Регистрация в команде":"Вход в кабинет"),
    el("p",{},isReg?"Придумайте пароль. Дальше вы будете входить по email и паролю с любого устройства.":"Войдите, чтобы вести своих партнёров и клиентов."),
    el("label",{class:"f"},"Email",el("input",{id:"aEmail",type:"email",required:true,autocomplete:"email",placeholder:"you@mail.ru"})),
    el("label",{class:"f"},"Пароль",el("input",{id:"aPass",type:"password",required:true,minlength:"6",autocomplete:isReg?"new-password":"current-password",placeholder:isReg?"Минимум 6 символов":""})),
    el("div",{class:"err",id:"aErr",hidden:true}),
    el("button",{class:"btn",type:"submit",id:"aBtn"},isReg?"Создать аккаунт":"Войти"),
    el("div",{style:"display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"},
      el("button",{type:"button",class:"linkbtn",onclick:()=>renderLogin(isReg?"login":"reg")},isReg?"У меня уже есть аккаунт":"Зарегистрироваться"),
      isReg?null:el("button",{type:"button",class:"linkbtn",onclick:async()=>{const em=$("#aEmail").value.trim();const r=$("#aErr");r.hidden=false;
        if(!em){r.textContent="Впишите email, и мы пришлём ссылку для нового пароля.";return}
        try{await AUTH.sendPasswordResetEmail(em);r.textContent="Письмо для смены пароля отправлено на "+em+". Проверьте и папку «Спам»."}catch(e){r.textContent=errText(e)}}},"Забыли пароль?")));
  f.addEventListener("submit",async e=>{e.preventDefault();const b=$("#aBtn");b.disabled=true;
    const em=$("#aEmail").value.trim(),pw=$("#aPass").value;
    try{if(isReg)await AUTH.createUserWithEmailAndPassword(em,pw);else await AUTH.signInWithEmailAndPassword(em,pw)}
    catch(err){b.disabled=false;const r=$("#aErr");r.hidden=false;r.textContent=errText(err)}});
  $("#main").replaceChildren(f);
}

function renderRegister(){
  $("#whoami").textContent="Регистрация";
  const f=el("form",{class:"reg"},
    el("h2",{},"Добро пожаловать в команду"),
    el("p",{},"Заполните профиль один раз. Дальше вы будете вести здесь своих партнёров и клиентов, а данные сохранятся."),

function start(){
