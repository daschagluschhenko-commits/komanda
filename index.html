<style>
/* Layout: sticky top bar with tabs → toolbar → card grid; detail opens in a side sheet (bottom sheet on phones) */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#eaefe9; --line:#d7ded5;
  --ink:#1c2a2a; --muted:#5d6b69; --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#d6ebe3;
  --warm:#e8894f; --warm-soft:#fbe6d8; --danger:#b8402f;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111817; --surface:#18221f; --surface-2:#1f2b28; --line:#2c3b37;
  --ink:#e6eeea; --muted:#97a8a3; --accent:#58c2a2; --accent-ink:#0d1a16; --accent-soft:#1d3a32;
  --warm:#f0a070; --warm-soft:#3a2a1f; --danger:#ef7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111817; --surface:#18221f; --surface-2:#1f2b28; --line:#2c3b37;
  --ink:#e6eeea; --muted:#97a8a3; --accent:#58c2a2; --accent-ink:#0d1a16; --accent-soft:#1d3a32;
  --warm:#f0a070; --warm-soft:#3a2a1f; --danger:#ef7a66; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:40px;height:40px;flex:none;filter:drop-shadow(0 2px 4px rgb(21 82 68/.25))}.logo svg{width:100%;height:100%;display:block}
.brand h1{font-size:16px}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--body);font-weight:500}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.tab{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.08)}
.tab .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;margin-left:4px}

/* banners */
.viewing{background:var(--warm-soft);border-bottom:1px solid var(--line)}
.viewing .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;font-weight:600;font-size:14px;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}

main{padding-block:24px 64px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.toolbar h2{font-size:20px;margin-right:auto}
.search{flex:1 1 220px;max-width:320px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:999px}
.btn{border:1px solid transparent;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:none;color:var(--danger);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent)}
.card .row{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.card .nm{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sub{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;gap:8px}
.meta b{color:var(--ink)}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.stage.s1{background:var(--warm-soft);color:var(--warm)}
.stage.s3,.stage.s4{background:var(--accent-soft);color:var(--accent)}
.due{color:var(--warm);font-weight:700}

/* empty */
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty h3{font-size:16px;color:var(--ink)}
.empty p{margin:0;max-width:46ch}

/* matrix table */
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px;text-align:center}
thead th{vertical-align:bottom;font-weight:600;color:var(--muted);height:150px;white-space:nowrap}
thead th .v{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:140px;overflow:hidden;text-overflow:ellipsis}
th.fio,td.fio{position:sticky;left:0;background:var(--surface);text-align:left;min-width:170px;max-width:220px;z-index:1;border-right:1px solid var(--line)}
td.fio button{border:0;background:none;font-weight:700;text-align:left;padding:4px;color:var(--ink)}
thead th.grp{height:auto;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--surface-2);border-right:1px solid var(--line)}
td.pct{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:none;display:grid;place-items:center;margin:auto;padding:0}
.tick[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick svg{width:14px;height:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 20 18/.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:21;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgb(0 0 0/.18)}
.sheet header{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.sheet header h2{font-size:17px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.sheet .body{overflow-y:auto;padding:20px;display:grid;gap:22px;flex:1}
.sheet footer{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet footer .sp{margin-right:auto}
@media (max-width:640px){.sheet{top:auto;height:92%;border-radius:18px 18px 0 0}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
@media (max-width:480px){.fields{grid-template-columns:1fr}}
.f{display:grid;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px;font-weight:500;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
.sec h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;font-family:var(--body);font-weight:800}
.sec h3 span{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:0}
.checks{display:grid;gap:6px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%;font-weight:600}
.chk .tick{margin:0;flex:none}
.chk[aria-checked="true"]{border-color:var(--accent-soft)}
.chk[aria-checked="true"] .lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
.bigmeter{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.bigmeter .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bigmeter b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}

/* register */
.reg{max-width:460px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;display:grid;gap:18px}
.reg h2{font-size:24px}
.reg p{margin:0;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-weight:600;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:40;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;font-weight:600}
@media (max-width:560px){.tabs{width:100%;justify-content:space-between}.tab{flex:1;padding:7px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    const hr=ws.getRow(3);hr.values=H;hr.height=32;xlHeader(hr);W.forEach((w,i)=>ws.getColumn(i+1).width=w);
    D.team.forEach(m=>{const r=ws.addRow([m.name,m.email,m.phone,m.atomyId,m.city,m.sponsor,m.partners,m.clients,m.progress/100,toDate(m.since)]);
      r.getCell(1).font={name:"Arial",size:10,bold:true,color:{argb:XC.ink}};
      [7,8].forEach(i=>r.getCell(i).alignment={horizontal:"center",vertical:"middle"});
      r.getCell(9).numFmt="0%";r.getCell(9).alignment={horizontal:"center",vertical:"middle"};r.getCell(10).numFmt="dd.mm.yyyy";r.getCell(10).alignment={horizontal:"center",vertical:"middle"}});
    if(!D.team.length)xlEmpty(ws,4,H.length,"Пока никто не зарегистрировался");
    xlBody(ws,4,H.length);
    if(D.team.length){ws.autoFilter={from:{row:3,column:1},to:{row:3+D.team.length,column:H.length}};
      const tr=ws.addRow(["Итого","","","","","",{formula:`SUM(G4:G${3+D.team.length})`},{formula:`SUM(H4:H${3+D.team.length})`}]);
      tr.eachCell(c=>{c.font={name:"Arial",size:10,bold:true,color:{argb:XC.ink}};c.border={top:{style:"medium",color:{argb:XC.green}}}});
      [7,8].forEach(i=>tr.getCell(i).alignment={horizontal:"center"})}
  }

  /* Партнёры */
  {
    const ws=wb.addWorksheet("Партнёры",{properties:{tabColor:{argb:"FF58C2A2"}}});
    const lead=own?["Чей партнёр"]:[];
    const info=[...lead,"ФИО","Телефон","ID в Атоми","Город","Дата рег."];
    const steps=ALL.map(a=>a[1]);
    const tail=["Шаги","Прогресс","Заметки"];
    const H=[...info,...steps,...tail];const n=H.length,s0=info.length+1,pCol=s0+steps.length+1;
    xlTitle(ws,"Путь новичка · партнёры","Выгрузка от "+dateRu+" · партнёров: "+D.partners.length+" · ✓ — шаг пройден",n);
    // group row
    const g=ws.getRow(3);g.height=20;
    ws.mergeCells(3,1,3,info.length);Object.assign(ws.getCell(3,1),{value:"Партнёр"});
    let c=s0;STAGES.forEach((st,i)=>{const e=c+st.items.length-1;if(e>c)ws.mergeCells(3,c,3,e);const cell=ws.getCell(3,c);cell.value=st.t;
      for(let k=c;k<=e;k++)ws.getCell(3,k).fill={type:"pattern",pattern:"solid",fgColor:{argb:STAGE_FILL[i]}};c=e+1});
    ws.mergeCells(3,c,3,n);ws.getCell(3,c).value="Итог";
    for(let k=1;k<=n;k++){const cell=ws.getCell(3,k);cell.font={name:"Arial",size:10,bold:true,color:{argb:XC.ink}};cell.alignment={horizontal:"center",vertical:"middle"};
      if(!cell.fill)cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.greenSoft}};cell.border={right:{style:"thin",color:{argb:XC.line}},bottom:{style:"thin",color:{argb:XC.line}}}}
    const hr=ws.getRow(4);hr.values=H;hr.height=150;
    xlHeader(hr,{rotate:steps.map((_,i)=>s0+i)});
    for(let i=0;i<steps.length;i++){const cell=hr.getCell(s0+i);let st=0,acc=0;for(;st<STAGES.length;st++){acc+=STAGES[st].items.length;if(i<acc)break}cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:STAGE_FILL[st]}}}
    const widths=[...(own?[20]:[]),24,18,12,15,12,...steps.map((_,i)=>i===steps.length-1?10:4.6),9,11,30];widths.forEach((w,i)=>ws.getColumn(i+1).width=w);
    const rows=[...D.partners].sort((a,b)=>(a.owner||"").localeCompare(b.owner||"","ru")||(a.p.name||"").localeCompare(b.p.name||"","ru"));
    rows.forEach(({owner,p})=>{const n1=done(p);
      const r=ws.addRow([...(own?[owner]:[]),p.name||"",p.phone||"",p.atomyId||"",p.city||"",toDate(p.regDate),...ALL.map(([k])=>p.checks&&p.checks[k]?"✓":""),n1+" / "+TOTAL,n1/TOTAL,p.notes||""]);
      r.height=22;r.getCell(info.length).numFmt="dd.mm.yyyy";r.getCell(info.length).alignment={horizontal:"center",vertical:"middle"};
      r.getCell(own?2:1).font={name:"Arial",size:10,bold:true,color:{argb:XC.ink}};
      ALL.forEach(([k],i)=>{const cell=r.getCell(s0+i);const on=p.checks&&p.checks[k];cell.alignment={horizontal:"center",vertical:"middle"};
        cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:on?XC.green:XC.white}};cell.font={name:"Arial",size:11,bold:true,color:{argb:XC.white}}});
      r.getCell(pCol-1).alignment={horizontal:"center",vertical:"middle"};
      const pc=r.getCell(pCol);pc.numFmt="0%";pc.alignment={horizontal:"center",vertical:"middle"};pc.font={name:"Arial",size:10,bold:true,color:{argb:XC.ink}}});
    if(!rows.length)xlEmpty(ws,5,n,"Партнёров пока нет");
    xlBody(ws,5,n);
    const colL=k=>ws.getColumn(k).letter;
    progressFmt(ws,colL(pCol),5,4+rows.length);
    ws.views=[{state:"frozen",xSplit:own?2:1,ySplit:4,showGridLines:false}];
    if(rows.length)ws.autoFilter={from:{row:4,column:1},to:{row:4+rows.length,column:n}};
  }

  /* Клиенты */
  {
    const ws=wb.addWorksheet("Клиенты",{properties:{tabColor:{argb:XC.warm}}});
    const H=[...(own?["Чей клиент"]:[]),"Имя","Телефон","Статус","Что покупает","Последний заказ","Когда связаться","Откуда пришёл","Город","Заметки"];
    const W=[...(own?[20]:[]),22,18,14,30,15,15,16,16,34];
    const today=toDate(D.date);
    const due=D.clients.filter(({c})=>c.nextContact&&toDate(c.nextContact)<=today&&c.status!=="Не актуален").length;
    xlTitle(ws,"Клиенты","Выгрузка от "+dateRu+" · клиентов: "+D.clients.length+(due?" · пора связаться: "+due+" (выделены оранжевым)":""),H.length);
    const hr=ws.getRow(3);hr.values=H;hr.height=32;xlHeader(hr);W.forEach((w,i)=>ws.getColumn(i+1).width=w);
    const o=own?1:0;
    const rows=[...D.clients].sort((a,b)=>(a.owner||"").localeCompare(b.owner||"","ru")||((a.c.nextContact||"9")<(b.c.nextContact||"9")?-1:1));
    rows.forEach(({owner,c})=>{const r=ws.addRow([...(own?[owner]:[]),c.name||"",c.phone||"",c.status||"",c.products||"",toDate(c.lastOrder),toDate(c.nextContact),c.source||"",c.city||"",c.notes||""]);
      r.getCell(1+o).font={name:"Arial",size:10,bold:true,color:{argb:XC.ink}};
      const st=r.getCell(3+o);st.alignment={horizontal:"center",vertical:"middle"};if(STATUS_FILL[c.status])st.fill={type:"pattern",pattern:"solid",fgColor:{argb:STATUS_FILL[c.status]}};
      [5,6].forEach(i=>{const cell=r.getCell(i+o);cell.numFmt="dd.mm.yyyy";cell.alignment={horizontal:"center",vertical:"middle"}});
      if(c.nextContact&&toDate(c.nextContact)<=today&&c.status!=="Не актуален"){const cell=r.getCell(6+o);cell.fill={type:"pattern",pattern:"solid",fgColor:{argb:XC.warm}};cell.font={name:"Arial",size:10,bold:true,color:{argb:XC.white}}}});
    if(!rows.length)xlEmpty(ws,4,H.length,"Клиентов пока нет");
    xlBody(ws,4,H.length);
    ws.views=[{state:"frozen",xSplit:1+o,ySplit:3,showGridLines:false}];
    if(rows.length)ws.autoFilter={from:{row:3,column:1},to:{row:3+rows.length,column:H.length}};
  }
  return wb;
}

function loadExcelJS(){return window.ExcelJS?Promise.resolve():new Promise((ok,bad)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";sc.onload=ok;sc.onerror=bad;document.head.appendChild(sc)})}
async function exportExcel(){
  const b=$("#excel");b.disabled=true;b.textContent="Готовлю…";
  try{
    await loadExcelJS();
    const D={isOwner:S.isOwner,date:today(),team:[],partners:[],clients:[]};
    if(S.isOwner){
      const ms=(await S.db.collection("members").get()).docs.map(d=>({id:d.id,...d.data()}));
      for(const m of ms){const r=S.db.collection("members").doc(m.id);
        const [ps,cs]=await Promise.all([r.collection("partners").get(),r.collection("clients").get()]);
        const pl=ps.docs.map(d=>d.data()),cl=cs.docs.map(d=>d.data());
        pl.forEach(p=>D.partners.push({owner:m.name||"",p}));cl.forEach(c=>D.clients.push({owner:m.name||"",c}));
        D.team.push({name:m.name||"",email:m.email||"",phone:m.phone||"",atomyId:m.atomyId||"",city:m.city||"",sponsor:m.sponsor||"",partners:pl.length,clients:cl.length,
          progress:pl.length?Math.round(pl.reduce((s,p)=>s+done(p),0)/pl.length/TOTAL*100):0,since:m.createdAt?m.createdAt.slice(0,10):""})}
      D.team.sort((a,b)=>a.name.localeCompare(b.name,"ru"));
    }else{D.partners=S.partners.map(p=>({p}));D.clients=S.clients.map(c=>({c}))}
    const buf=await buildWorkbook(window.ExcelJS,D).xlsx.writeBuffer();
    const url=URL.createObjectURL(new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
    const a=document.createElement("a");a.href=url;a.download=(S.isOwner?"komanda_vsya_":"moya_baza_")+D.date+".xlsx";document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast("Файл скачан");
  }catch(e){console.error(e);toast("Не получилось скачать. Проверьте интернет")}
  finally{b.disabled=false;b.textContent="Скачать Excel"}
}

/* ---------- sheets ---------- */
let sheetState=null;
function closeSheet(){sheetState=null;$("#sheetRoot").replaceChildren()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetState)closeSheet()});
function refreshSheet(){if(sheetState&&sheetState.kind==="p"&&sheetState.id)drawPartnerChecks()}
function sheet(title,body,footer){
  $("#sheetRoot").replaceChildren(el("div",{class:"scrim",onclick:closeSheet}),
    el("aside",{class:"sheet",role:"dialog","aria-modal":"true","aria-label":title},
      el("header",{},el("h2",{},title),el("button",{class:"x","aria-label":"Закрыть",onclick:closeSheet},"×")),
      el("div",{class:"body"},body),el("footer",{},footer)));
}
function confirmDelete(btn,fn){if(btn.dataset.arm){fn();return}btn.dataset.arm="1";btn.textContent="Точно удалить?";setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent="Удалить"}},3000)}

function openPartner(id){
  const p=id?S.partners.find(x=>x.id===id):{checks:{}};if(!p)return;
  sheetState={kind:"p",id};
  const fld=(lab,key,attrs={})=>el("label",{class:"f "+(attrs.full?"full":"")},lab,el("input",{id:"pf_"+key,value:p[key]||"",...attrs,full:false}));
  const fields=el("div",{class:"fields"},
    el("label",{class:"f full"},"ФИО",el("input",{id:"pf_name",value:p.name||"",placeholder:"Имя и фамилия партнёра"})),
    fld("Телефон","phone",{inputmode:"tel",placeholder:"+7…"}),fld("ID в Атоми","atomyId",{inputmode:"numeric"}),
    fld("Город","city"),el("label",{class:"f"},"Дата регистрации",el("input",{id:"pf_regDate",type:"date",value:p.regDate||""})),
    el("label",{class:"f full"},"Заметки",el("textarea",{id:"pf_notes",placeholder:"Цели, сложности, о чём договорились"},p.notes||"")));
  const body=[el("div",{id:"pChecks",style:"display:grid;gap:22px"}),el("div",{class:"sec"},el("h3",{},"Данные партнёра"),fields)];
  const save=el("button",{class:"btn",onclick:async()=>{
    const d={name:$("#pf_name").value.trim(),phone:$("#pf_phone").value.trim(),atomyId:$("#pf_atomyId").value.trim(),city:$("#pf_city").value.trim(),regDate:$("#pf_regDate").value,notes:$("#pf_notes").value.trim(),updatedAt:new Date().toISOString()};
    if(!d.name){$("#pf_name").focus();toast("Впишите имя");return}
    save.disabled=true;
    try{if(id)await base().collection("partners").doc(id).update(d);else{d.checks=sheetState.draft||{};d.createdAt=d.updatedAt;await base().collection("partners").add(d)}toast("Сохранено");closeSheet()}
    catch{save.disabled=false;toast("Не сохранилось, попробуйте ещё раз")}}},id?"Сохранить":"Добавить партнёра");
  const del=id?el("button",{class:"btn danger",onclick:()=>confirmDelete(del,async()=>{try{await base().collection("partners").doc(id).delete();toast("Удалено");closeSheet()}catch{toast("Не удалось удалить")}})},"Удалить"):null;
  if(!id)sheetState.draft={};
  sheet(id?p.name||"Партнёр":"Новый партнёр",body,[del,el("span",{class:"sp"}),el("button",{class:"btn ghost",onclick:closeSheet},"Отмена"),save]);
  drawPartnerChecks();
  if(!id)setTimeout(()=>$("#pf_name").focus(),50);
}
function drawPartnerChecks(){
  const box=$("#pChecks");if(!box||!sheetState)return;
  const p=sheetState.id?S.partners.find(x=>x.id===sheetState.id):{checks:sheetState.draft};if(!p)return closeSheet();
  const n=done(p);
  box.replaceChildren(
    el("div",{class:"bigmeter"},el("div",{class:"top2"},el("span",{style:"font-weight:700"},"Путь новичка"),el("b",{},n+" / "+TOTAL)),el("div",{class:"meter"},el("i",{style:`width:${n/TOTAL*100}%`})),el("span",{class:"note"},nextStep(p))),
    ...STAGES.map(s=>el("div",{class:"sec"},el("h3",{},s.t,el("span",{},s.items.filter(([k])=>p.checks&&p.checks[k]).length+" из "+s.items.length)),
      el("div",{class:"checks"},s.items.map(([k,l])=>{const on=!!(p.checks&&p.checks[k]);const t=el("span",{class:"tick","aria-checked":on});if(on)t.innerHTML=TICK;
        return el("button",{class:"chk",role:"checkbox","aria-checked":on,onclick:()=>{if(sheetState.id)toggle(p,k);else{sheetState.draft[k]=!sheetState.draft[k];drawPartnerChecks()}}},t,el("span",{class:"lbl"},l))})))));
}

function openClient(id){
  const c=id?S.clients.find(x=>x.id===id):{status:"Новый"};if(!c)return;
  sheetState={kind:"c",id};
  const body=[el("div",{class:"fields"},
    el("label",{class:"f full"},"Имя",el("input",{id:"cf_name",value:c.name||"",placeholder:"Имя клиента"})),
    el("label",{class:"f"},"Телефон",el("input",{id:"cf_phone",value:c.phone||"",inputmode:"tel",placeholder:"+7…"})),
    el("label",{class:"f"},"Статус",el("select",{id:"cf_status"},CLIENT_STATUS.map(s=>el("option",{value:s,selected:c.status===s},s)))),
    el("label",{class:"f full"},"Что покупает / интересует",el("input",{id:"cf_products",value:c.products||"",placeholder:"ХемоХим, зубная паста, крем…"})),
    el("label",{class:"f"},"Последний заказ",el("input",{id:"cf_lastOrder",type:"date",value:c.lastOrder||""})),
    el("label",{class:"f"},"Город",el("input",{id:"cf_city",value:c.city||""})),
    nextContactField(c.nextContact||""),
    el("label",{class:"f full"},"Откуда пришёл",el("input",{id:"cf_source",value:c.source||"",placeholder:"Инстаграм, знакомые…"})),
    el("label",{class:"f full"},"Заметки",el("textarea",{id:"cf_notes",placeholder:"Пожелания, о чём говорили"},c.notes||"")))];
  const save=el("button",{class:"btn",onclick:async()=>{
    const d={};["name","phone","status","products","lastOrder","nextContact","source","city","notes"].forEach(k=>d[k]=$("#cf_"+k).value.trim());d.updatedAt=new Date().toISOString();
    if(!d.name){$("#cf_name").focus();toast("Впишите имя");return}
    save.disabled=true;
    try{if(id)await base().collection("clients").doc(id).update(d);else{d.createdAt=d.updatedAt;await base().collection("clients").add(d)}toast("Сохранено");closeSheet()}
    catch{save.disabled=false;toast("Не сохранилось, попробуйте ещё раз")}}},id?"Сохранить":"Добавить клиента");
  const del=id?el("button",{class:"btn danger",onclick:()=>confirmDelete(del,async()=>{try{await base().collection("clients").doc(id).delete();toast("Удалено");closeSheet()}catch{toast("Не удалось удалить")}})},"Удалить"):null;
  sheet(id?c.name||"Клиент":"Новый клиент",body,[del,el("span",{class:"sp"}),el("button",{class:"btn ghost",onclick:closeSheet},"Отмена"),save]);
  if(!id)setTimeout(()=>$("#cf_name").focus(),50);
}
